- title: "2024 | Living With Weather: First Nations' Cultural Governance Workshop 1"
  group: featured
  date: 2024-11-12 to 2024-11-14
  subtitle: "Charles Darwin University, Darwin (NT)"
  image: images/photo.jpg
  description: "This workshop was held to initiate First Nations governance for the research project First Nations AI: Country, Climate, Communication 
  We are inviting elders and leaders from remote communities in the Northern Territory to share their knowledge and experiences about living with weather 
  on country, and to think about how we might use technology for weather in ways that are driven by community and country. The workshop was facilitated by 
  Ian Gumbula with the support of Steven Bird, Nic Bidwell, Angel Aquino, Jenny Manmurulu, Leah Leaman, Anita Munyarryun, Colin Hall, Stephen Dhamarrandji, and Kylinda Brown "
  tags:
    - workshop

