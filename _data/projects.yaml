- title: "Living With Weather: First Nations' Cultural Governance Workshop 2"
  subtitle: "Warruwi (NT)"
  date: 17–24 June
  group: featured
  image: images/photo.jpg
  description: "This workshop was the latest in a series aimed at strengthening First Nations governance and building capacity for intercultural cooperation around weather, climate, and emergencies. Elders and leaders from remote Northern Territory communities were invited to share their knowledge, experiences, and governance practices around weather on country, while leaders from government services were invited to listen deeply to community stories and discuss how communities and services could work together to keep people safe. The session explored good practices for intercultural communication and both-ways learning, and worked on ways to strengthen cultural governance around weather and technology. It was facilitated by Ian Gumbula with the support of Nic Bidwell, Jens Chemung, and Angel Aquino, as part of the ARC-funded CDE research project First Nations AI: Country, Climate, Communication."
  tags:
    - workshop

- title: "Living With Weather: First Nations' Cultural Governance Workshop 1"
  group: featured
  date: 12-14 November
  subtitle: "Charles Darwin University, Darwin (NT)"
  image: images/photo.jpg
  description: "This workshop was held to initiate First Nations governance for the research project First Nations AI: Country, Climate, Communication. Elders and leaders from remote Northern Territory communities were invited to share their knowledge and experiences of living with weather on country, and to consider how technology for weather might be used in ways driven by community and country. It was facilitated by Ian Gumbula with the support of Steven Bird, Nic Bidwell, Angel Aquino, Jenny Manmurulu, Leah Leaman, Anita Munyarryun, Colin Hall, Stephen Dhamarandji, and Kylanda Brown."
  tags:
    - workshop

- title: "First Nations' Weather and Climate Communication Workshop"
  group: featured
  date: 14-15 November
  subtitle: "Guluman Child and Family Centre, Ngukurr (NT)"
  image: images/photo.jpg
  description: "This workshop addressed severe weather hazards facing remote First Nations communities, including cyclones, severe winds, thunderstorms, and floods, which are intensifying due to climate change. Facilitated by Ian Gumbula with support from Mercy Gumbula, Bureau of Meteorology representatives Josie Matthieson, Alice Nagy, and Ian Shepherd, and Charles Darwin University researchers Steven Bird and Angelinah Aquino, the session explored how remote communities and government agencies could work together to keep people safe. It also consulted traditional owners and community leaders in Ngukurr about local knowledge and governance practices around weather and climate, and discussed what was working well in the community and what could work better."
  tags:
    - workshop

- title: "2First Nations' Climate Communication: From AI to VOICE"
  group: featured
  date: 16-18 May
  subtitle: "Darwin (NT)"
  image: images/photo.jpg
  description: "This workshop brought together people from remote First Nations communities in the Top End with staff from the NT Emergency Services, the Aboriginal Interpreter Service, and the Bureau of Meteorology to address severe weather hazards, including cyclones, severe thunderstorms, and floods, which are becoming more extreme as global heating intensifies. Led by Yolu leaders Ian and Mercy Gumbula and supported by Steven Bird, Nicola Bidwell, and Angel Aquino, participants explored how communities and government agencies can work together to keep people safe, including the risks and harms that agencies cannot see and how communities decide when to prepare or act. The discussion also covered what is working well, what could work better, and the risks and benefits of AI, and the group took time to listen deeply to Indigenous Voice. This workshop was facilitated by Ian Gumbula with the support of Steven Bird, Angel Aquino and Nicola Bidwell."
  tags:
    - workshop
