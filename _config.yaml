# site properties and page defaults
title: Living With Weather
subtitle: Research Group - Faculty of Science & IT - CDU Garramilla
url: "https://livingwithweather.github.io"
baseurl: ""
description: "This is an ARC-funded project, First Nations AI: Country, Climate, Communication, at Charles Darwin University. Together, our team of Indigenous and Western scholars aims to develop a systematic account of Artificial Intelligence (AI) and its possibilities in climate change communication in remote First Nations communities in northern Australia."
header: images/background.jpeg
footer: images/background.jpeg
proofer: false

# site social media and other links
links:
  email: livingwithweather@outlook.com
  github: livingwithweather

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
